<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planet Jumping</title>
    <style>
      /*
        This single-file build keeps the motion system, layout, and data model in one place,
        which makes it easier to tweak the experience without jumping across multiple files.
      */
      @font-face {
        font-family: 'SF Pro';
        src: local('SF Pro'), local('Segoe UI'), Arial, sans-serif;
        font-weight: 400;
        font-style: normal;
      }

      @font-face {
        font-family: 'SF Pro';
        src: local('SF Pro Bold'), local('Segoe UI Bold'), Arial, sans-serif;
        font-weight: 700;
        font-style: normal;
      }

      @font-face {
        font-family: 'SF Pro Thin';
        src: local('SF Pro Thin'), local('SF Pro'), Arial, sans-serif;
        font-weight: 100;
        font-style: normal;
      }

      @font-face {
        font-family: 'Aalto';
        src: local('Aalto'), local('Arial Narrow'), sans-serif;
        font-weight: 400;
        font-style: normal;
      }

      :root {
        font-family: 'SF Pro', Arial, sans-serif;
        color: #fff;
        background: #090807;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        background: #090807;
      }

      html, body, button, a, .portal {
        cursor: none !important;
      }

      .experience {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 540px;
        overflow: hidden;
        background: #0a0908;
      }

      .backgrounds,
      .background,
      .shade,
      .transition-layer,
      .transition-layer video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .background {
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.8s ease;
      }

      .background.is-visible {
        opacity: 1;
      }

      .shade {
        z-index: 1;
        background: linear-gradient(to bottom, transparent 52%, rgba(0, 0, 0, 0.88) 100%);
        pointer-events: none;
      }

      .chrome {
        position: absolute;
        z-index: 4;
        transition: opacity 0.45s ease, filter 0.45s ease;
      }

      .experience.is-transitioning .chrome {
        opacity: 0;
        filter: blur(8px);
        pointer-events: none;
      }

      .header {
        left: clamp(18px, 1.95vw, 28px);
        right: clamp(18px, 1.95vw, 28px);
        top: clamp(18px, 3.1vh, 28px);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
      }

      .nav {
        display: flex;
        align-items: center;
        height: 42px;
        padding: 4px 5px;
        border: 1px solid rgba(255, 255, 255, 0.45);
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        border-radius: 999px;
      }

      .nav a {
        color: #fff;
        text-decoration: none;
        padding: 8px 19px;
        border-radius: 999px;
        line-height: 1;
      }

      .nav a.active {
        background: #fff;
        color: #000;
      }

      .menu {
        height: 42px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #000;
        cursor: pointer;
      }

      .planet-list {
        left: clamp(18px, 1.95vw, 28px);
        top: 50%;
        transform: translateY(-43%);
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 16px;
      }

      .planet-item {
        display: flex;
        align-items: center;
        min-height: 20px;
      }

      .planet-item.active {
        font-size: 18px;
        font-weight: 700;
        gap: 8px;
      }

      .planet-item.active::before {
        content: '';
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
      }

      .portal-wrap {
        left: 50%;
        top: 50%;
        width: min(320px, 31vw);
        transform: translate(-50%, -54%);
        perspective: none;
      }

      .portal-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        font-size: 16px;
        opacity: 0;
      }

      .portal-heading strong {
        font-size: 18px;
        margin-left: 8px;
      }

      .portal {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 320 / 350;
        padding: 0;
        overflow: visible;
        border: 0;
        border-radius: 90px;
        background: transparent;
        cursor: pointer;
        box-shadow: none;
        transform: none !important;
      }

      .portal video,
      .portal img {
        visibility: hidden;
        position: absolute;
        width: 1px;
        height: 1px;
        pointer-events: none;
      }

      .portal-canvas {
        position: fixed;
        inset: 0;
        z-index: 3;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .planet-content {
        left: clamp(28px, 4vw, 58px);
        right: clamp(28px, 3vw, 44px);
        bottom: clamp(24px, 3vh, 30px);
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 40px;
      }

      .planet-content h1 {
        font-family: 'Aalto', 'Arial Narrow', sans-serif;
        font-size: clamp(128px, 21.8vw, 314px);
        font-weight: 400;
        line-height: 0.72;
        margin: 0 0 -0.04em;
        letter-spacing: 0;
        transform: translateX(-32px);
        opacity: 0;
      }

      .planet-content dl {
        width: min(447px, 34vw);
        margin: 0;
        font-size: 16px;
      }

      .fact {
        display: grid;
        grid-template-columns: 138px 1fr;
        gap: 18px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.48);
        opacity: 0;
      }

      .fact:last-child { border-bottom: 0; }
      .fact dt { font-weight: 700; }
      .fact dd { margin: 0; }

      .transition-layer { display: none; }
      .scene-canvas { display: none; }

      .loading {
        position: absolute;
        z-index: 12;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%);
        opacity: 0;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        transition: opacity 0.2s;
      }

      .experience.is-loading .loading {
        opacity: 0.8;
      }

      .experience.is-transitioning .header,
      .experience.is-transitioning .planet-list {
        opacity: 1;
        filter: none;
        pointer-events: auto;
      }

      .experience.is-transitioning .shade {
        opacity: 1;
      }

      .experience.is-committing .background {
        transition: none !important;
      }

      .preloader {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: #000;
        overflow: hidden;
      }

      .preloader video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .preloader-shade {
        position: absolute;
        inset: auto 0 0;
        height: 35%;
        background: linear-gradient(to bottom, transparent, #000);
      }

      .preloader.is-background {
        z-index: 0;
      }

      .preloader.is-background .preloader-shade {
        opacity: 0;
      }

      .floating-logo {
        position: fixed;
        z-index: 22;
        left: 50%;
        top: 50%;
        width: 59px;
        height: 58px;
        transform: translate(-50%, -50%);
        will-change: left, top, width, height, transform;
        transition:
          left 2s cubic-bezier(0.16, 1, 0.3, 1),
          top 2s cubic-bezier(0.16, 1, 0.3, 1),
          width 2s cubic-bezier(0.16, 1, 0.3, 1),
          height 2s cubic-bezier(0.16, 1, 0.3, 1),
          transform 2s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .floating-logo.is-docked {
        left: clamp(18px, 1.95vw, 28px);
        top: clamp(18px, 3.1vh, 28px);
        width: 37px;
        height: 36px;
        transform: none;
      }

      .floating-logo.is-settled {
        z-index: 5;
      }

      .preloader-count {
        position: fixed;
        z-index: 22;
        left: 50%;
        bottom: clamp(22px, 3.1vh, 28px);
        display: flex;
        align-items: flex-end;
        gap: 4px;
        transform: translateX(-50%);
        font-family: 'SF Pro', Arial, sans-serif;
        line-height: 1;
      }

      .preloader-count > span:first-child {
        font-family: 'SF Pro Thin', 'SF Pro', Arial, sans-serif;
        font-size: 64px;
        font-weight: 100;
      }

      .preloader-count .percent {
        font-size: 24px;
        padding-bottom: 4px;
      }

      .preloader-count.is-leaving {
        animation: preload-count-out 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes preload-count-out {
        to {
          opacity: 0;
          filter: blur(7px);
          transform: translate(-50%, -34px);
        }
      }

      body:not(.preload-complete) .custom-cursor {
        opacity: 0 !important;
      }

      body:not(.intro-ready) .header,
      body:not(.intro-ready) .planet-list,
      body:not(.intro-ready) .planet-content h1,
      body:not(.intro-ready) .planet-content .fact {
        opacity: 0;
      }

      .intro-ready .header {
        animation: reveal-down 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
      }

      .intro-ready .planet-list {
        animation: reveal-side 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.65s both;
      }

      .content-revealing h1 {
        animation: title-rise 1.05s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .content-revealing .fact {
        animation: fact-rise 0.72s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .fact:nth-child(1) { animation-delay: 0.52s; }
      .fact:nth-child(2) { animation-delay: 0.68s; }
      .fact:nth-child(3) { animation-delay: 0.84s; }
      .fact:nth-child(4) { animation-delay: 1s; }

      .mask-revealing .portal-heading {
        animation: portal-caption 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .planet-list.is-switching .planet-item {
        animation: menu-row 0.58s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .planet-list.is-switching .planet-item:nth-child(1) { animation-delay: 0.02s; }
      .planet-list.is-switching .planet-item:nth-child(2) { animation-delay: 0.05s; }
      .planet-list.is-switching .planet-item:nth-child(3) { animation-delay: 0.08s; }
      .planet-list.is-switching .planet-item:nth-child(4) { animation-delay: 0.11s; }
      .planet-list.is-switching .planet-item:nth-child(5) { animation-delay: 0.14s; }
      .planet-list.is-switching .planet-item:nth-child(6) { animation-delay: 0.17s; }
      .planet-list.is-switching .planet-item:nth-child(7) { animation-delay: 0.2s; }
      .planet-list.is-switching .planet-item:nth-child(8) { animation-delay: 0.23s; }

      .planet-list.is-switching .planet-item.active::before {
        animation: active-dot 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.18s both;
      }

      @keyframes reveal-down {
        from {
          opacity: 0;
          filter: blur(8px);
          transform: translateY(-18px);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translateY(0);
        }
      }

      @keyframes reveal-side {
        from {
          opacity: 0;
          filter: blur(8px);
          transform: translate(-20px, -43%);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translate(0, -43%);
        }
      }

      @keyframes title-rise {
        from {
          opacity: 0;
          filter: blur(12px);
          transform: translate(-32px, 42px);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translate(-32px, 0);
        }
      }

      @keyframes fact-rise {
        from {
          opacity: 0;
          filter: blur(7px);
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translateY(0);
        }
      }

      @keyframes portal-caption {
        from {
          opacity: 0;
          filter: blur(7px);
          transform: translateY(22px);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translateY(0);
        }
      }

      @keyframes menu-row {
        from {
          opacity: 0.35;
          transform: translateX(-8px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes active-dot {
        from {
          opacity: 0;
          transform: scale(0);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .custom-cursor {
        display: block;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 100;
        width: 1px;
        height: 1px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .custom-cursor.is-visible {
        opacity: 1;
      }

      .cursor-dot,
      .cursor-orbit {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }

      .cursor-dot {
        width: 12px;
        height: 12px;
        background: #fff;
      }

      .cursor-orbit {
        width: 36px;
        height: 36px;
        border: 1px solid #fff;
        background: rgba(255, 255, 255, 0.4);
        transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .custom-cursor.is-enter .cursor-orbit {
        transform: translate(-50%, -50%) scale(1.16);
      }

      .cursor-label {
        position: absolute;
        top: 26px;
        left: 0;
        transform: translateX(-50%) translateY(-4px);
        font: 16px/1.2 'SF Pro', Arial, sans-serif;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.2s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .custom-cursor.is-enter .cursor-label {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @media (max-width: 900px) {
        .nav { display: none; }
        .portal-wrap { width: min(300px, 48vw); }
        .planet-content h1 { font-size: clamp(105px, 24vw, 190px); }
        .planet-content dl { width: 43vw; }
        .fact { grid-template-columns: 110px 1fr; }
        .planet-list { font-size: 14px; }
        .planet-item.active { font-size: 16px; }
      }

      @media (max-width: 640px) {
        .experience { min-height: 600px; }
        .planet-list { display: none; }
        .portal-wrap { top: 44%; width: min(260px, 66vw); }
        .planet-content {
          left: 18px;
          right: 18px;
          bottom: 18px;
          display: block;
        }
        .planet-content h1 {
          font-size: clamp(98px, 30vw, 160px);
          margin-bottom: 20px;
        }
        .planet-content dl { width: 100%; font-size: 13px; }
        .fact { grid-template-columns: 92px 1fr; padding: 5px 0; }
        .portal-heading { font-size: 14px; }
        .portal-heading strong { font-size: 16px; }
        .menu { height: 38px; }
        .portal { border-radius: 70px; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { transition-duration: 0.01ms !important; }
        .portal { transform: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="experience" data-planet="mars">
      <div class="backgrounds" aria-hidden="true">
        <video id="mars-background" class="background is-visible" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4" muted playsinline preload="auto"></video>
        <video id="earth-background" class="background" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
        <video id="venus-background" class="background" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b30f64d9-1637-477a-83df-d0fc6461a422.mp4" muted playsinline preload="auto"></video>
      </div>

      <div class="preloader" id="preloader" aria-label="Loading Mars">
        <video id="preloader-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4" muted playsinline preload="auto"></video>
        <div class="preloader-shade"></div>
      </div>

      <img class="floating-logo" id="floating-logo" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg" alt="Ubernatural" />

      <div class="preloader-count" id="preloader-count" aria-live="polite">
        <span id="preloader-value">0</span><span class="percent">%</span>
      </div>

      <canvas id="scene-canvas" class="scene-canvas" aria-hidden="true"></canvas>
      <canvas id="portal-canvas" class="portal-canvas" aria-hidden="true"></canvas>
      <div class="shade" aria-hidden="true"></div>

      <header class="header chrome">
        <div class="header-actions">
          <nav class="nav" aria-label="Primary navigation">
            <a class="active" href="#about">About</a>
            <a href="#explore">Explore</a>
            <a href="#planets">Planets</a>
          </nav>
          <button class="menu" type="button">Menu</button>
        </div>
      </header>

      <aside class="planet-list chrome" aria-label="Planets"></aside>

      <section class="portal-wrap chrome" aria-label="Next destination">
        <div class="portal-heading">
          <span>Next:</span>
          <span><span id="next-number">[03]</span> <strong id="next-name">Earth</strong></span>
        </div>

        <button class="portal" id="portal" type="button" aria-label="Travel to Earth">
          <video id="portal-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
          <img id="portal-image" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg" alt="Mercury" />
        </button>
      </section>

      <section class="planet-content chrome" aria-live="polite">
        <h1 id="planet-title">MARS</h1>
        <dl id="facts"></dl>
      </section>

      <div class="transition-layer" aria-hidden="true"><video id="transition-video"></video></div>
      <div class="loading" aria-hidden="true">Preparing orbit…</div>

      <div class="custom-cursor" aria-hidden="true">
        <span class="cursor-orbit"></span>
        <span class="cursor-dot"></span>
        <span class="cursor-label">Enter</span>
      </div>
    </main>

    <script>
      const BASE = 'https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P';
      const MARS_BG = `${BASE}/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4`;
      const TO_EARTH = `${BASE}/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4`;
      const TO_VENUS = `${BASE}/b30f64d9-1637-477a-83df-d0fc6461a422.mp4`;
      const TO_MARS = `${BASE}/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4`;
      const MERCURY = `${BASE}/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg`;
      const LOGO = `${BASE}/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg`;

      const planets = ['Mercury', 'Venus', 'Earth', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'];

      const states = {
        mars: {
          name: 'Mars',
          next: 'Earth',
          number: '[03]',
          portal: TO_EARTH,
          background: 'mars-background',
          facts: [
            ['Distance:', 'About 228 million km (1.5 astronomical units).'],
            ['Year:', 'One Martian year is equal to 687 Earth days.'],
            ['Temperature:', 'Around -60 °C, dropping to -125 °C at the poles in winter.'],
            ['Atmosphere:', 'Very thin, consisting of 95% carbon dioxide, with frequent dust storms.']
          ]
        },
        earth: {
          name: 'Earth',
          next: 'Venus',
          number: '[02]',
          portal: TO_VENUS,
          background: 'earth-background',
          facts: [
            ['Distance:', '149.6 million km from the Sun.'],
            ['Year:', '365.25 Earth days.'],
            ['Temperature:', 'Average surface temperature around 15 °C.'],
            ['Atmosphere:', 'Mostly nitrogen and oxygen, supporting life and liquid water.']
          ]
        },
        venus: {
          name: 'Venus',
          next: 'Mercury',
          number: '[06]',
          image: MERCURY,
          background: 'venus-background',
          facts: [
            ['Distance:', '108.2 million km from the Sun.'],
            ['Year:', '225 Earth days.'],
            ['Temperature:', 'Around 465 °C — the hottest planet in the Solar System.'],
            ['Atmosphere:', 'Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.']
          ]
        }
      };

      const experience = document.querySelector('.experience');
      const preloader = document.getElementById('preloader');
      const preloaderVideo = document.getElementById('preloader-video');
      const preloaderValue = document.getElementById('preloader-value');
      const preloaderCount = document.getElementById('preloader-count');
      const floatingLogo = document.getElementById('floating-logo');
      const portal = document.getElementById('portal');
      const portalVideo = document.getElementById('portal-video');
      const portalImage = document.getElementById('portal-image');
      const transitionVideo = document.getElementById('transition-video');
      const portalCanvas = document.getElementById('portal-canvas');
      const portalCtx = portalCanvas.getContext('2d');
      const sceneCanvas = document.getElementById('scene-canvas');
      const sceneCtx = sceneCanvas.getContext('2d');
      const menuButton = document.querySelector('.menu');
      const planetList = document.querySelector('.planet-list');

      let current = 'mars';
      let busy = false;
      let transitionActive = false;
      let expansion = 0;
      let maskScale = 1;
      let canvasOpacity = 1;
      let sceneFrozen = false;
      let rotX = 0;
      let rotY = 0;
      let targetX = 0;
      let targetY = 0;
      let pointerX = 0;
      let pointerY = 0;
      let lastFrame = 0;

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function animateValue(setter, duration, onComplete) {
        return new Promise((resolve) => {
          const start = performance.now();
          const tick = (now) => {
            const elapsed = (now - start) / duration;
            const value = easeInOutCubic(clamp(elapsed, 0, 1));
            setter(value);
            if (elapsed < 1) {
              requestAnimationFrame(tick);
            } else {
              if (typeof onComplete === 'function') onComplete();
              resolve();
            }
          };
          requestAnimationFrame(tick);
        });
      }

      function nextFrame() {
        return new Promise((resolve) => requestAnimationFrame(() => resolve()));
      }

      function mediaReady(media, timeoutMs = 2400) {
        return new Promise((resolve) => {
          if (!media) {
            resolve();
            return;
          }

          const finish = () => {
            media.removeEventListener('loadeddata', finish);
            media.removeEventListener('canplay', finish);
            media.removeEventListener('canplaythrough', finish);
            clearTimeout(timer);
            resolve();
          };

          const timer = setTimeout(finish, timeoutMs);
          media.addEventListener('loadeddata', finish, { once: true });
          media.addEventListener('canplay', finish, { once: true });
          media.addEventListener('canplaythrough', finish, { once: true });

          if (media.tagName === 'VIDEO' && media.readyState >= 2) {
            finish();
          } else if (media.tagName === 'IMG' && media.complete) {
            finish();
          }
        });
      }

      function render() {
        const state = states[current];
        experience.dataset.planet = current;
        document.getElementById('planet-title').textContent = state.name.toUpperCase();
        document.getElementById('next-name').textContent = state.next;
        document.getElementById('next-number').textContent = state.number;
        portal.setAttribute('aria-label', `Travel to ${state.next}`);

        const facts = document.getElementById('facts');
        facts.innerHTML = state.facts
          .map(([key, value]) => `<div class="fact"><dt>${key}</dt><dd>${value}</dd></div>`)
          .join('');

        const items = planets.map((planet) => {
          const isActive = current === planet.toLowerCase();
          return `<span class="planet-item ${isActive ? 'active' : ''}">${planet}</span>`;
        }).join('');

        planetList.innerHTML = items;

        const backgrounds = document.querySelectorAll('.background');
        backgrounds.forEach((video) => {
          video.classList.toggle('is-visible', video.id === state.background);
          video.pause();
          video.currentTime = 0;
        });

        if (state.image) {
          portalImage.src = state.image;
          portalImage.style.visibility = 'visible';
          portalVideo.style.visibility = 'hidden';
        } else {
          const nextVideo = state.portal;
          if (portalVideo.src !== nextVideo) {
            portalVideo.src = nextVideo;
          }
          portalVideo.style.visibility = 'visible';
          portalImage.style.visibility = 'hidden';
        }

        const list = document.querySelector('.planet-list');
        list.classList.remove('is-switching');
        void list.offsetWidth;
        list.classList.add('is-switching');
      }

      function resizeCanvas() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        portalCanvas.width = window.innerWidth * ratio;
        portalCanvas.height = window.innerHeight * ratio;
        portalCanvas.style.width = `${window.innerWidth}px`;
        portalCanvas.style.height = `${window.innerHeight}px`;

        sceneCanvas.width = window.innerWidth * ratio;
        sceneCanvas.height = window.innerHeight * ratio;
        sceneCanvas.style.width = `${window.innerWidth}px`;
        sceneCanvas.style.height = `${window.innerHeight}px`;

        portalCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
        sceneCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function drawCover(ctx, media) {
        if (!media) return;

        const width = media.videoWidth || media.naturalWidth || media.width || window.innerWidth;
        const height = media.videoHeight || media.naturalHeight || media.height || window.innerHeight;
        const scale = Math.max(window.innerWidth / width, window.innerHeight / height);
        const drawWidth = width * scale;
        const drawHeight = height * scale;
        const x = (window.innerWidth - drawWidth) / 2;
        const y = (window.innerHeight - drawHeight) / 2;

        ctx.save();
        ctx.drawImage(media, x, y, drawWidth, drawHeight);
        ctx.restore();
      }

      function drawShade(ctx) {
        const g = ctx.createLinearGradient(0, window.innerHeight * 0.52, 0, window.innerHeight);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,0,0,0.88)');
        ctx.fillStyle = g;
        ctx.fillRect(0, window.innerHeight * 0.52, window.innerWidth, window.innerHeight * 0.48);
      }

      function buildRoundedPath(points, closed = true) {
        const path = new Path2D();
        if (!points.length) return path;
        path.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i += 1) {
          path.lineTo(points[i].x, points[i].y);
        }
        if (closed) path.closePath();
        return path;
      }

      function generateRoundedRectPoints(w, h, radius) {
        const points = [];
        const corners = [
          { cx: w / 2 - radius, cy: -h / 2 + radius, start: -Math.PI / 2, end: 0 },
          { cx: w / 2 - radius, cy: h / 2 - radius, start: 0, end: Math.PI / 2 },
          { cx: -w / 2 + radius, cy: h / 2 - radius, start: Math.PI / 2, end: Math.PI },
          { cx: -w / 2 + radius, cy: -h / 2 + radius, start: Math.PI, end: Math.PI * 1.5 }
        ];

        corners.forEach(({ cx, cy, start, end }) => {
          const steps = 10;
          for (let i = 0; i <= steps; i += 1) {
            const angle = start + ((end - start) * i) / steps;
            points.push({
              x: cx + radius * Math.cos(angle),
              y: cy + radius * Math.sin(angle)
            });
          }
        });

        return points;
      }

      function drawPortalMask() {
        const rect = portal.getBoundingClientRect();
        const e = expansion;
        const cx = rect.left + rect.width / 2 + (window.innerWidth / 2 - (rect.left + rect.width / 2)) * e;
        const cy = rect.top + rect.height / 2 + (window.innerHeight / 2 - (rect.top + rect.height / 2)) * e;
        const baseW = rect.width + (window.innerWidth - rect.width) * e;
        const baseH = rect.height + (window.innerHeight - rect.height) * e;
        const scale = e ? 1 : maskScale;
        const w = baseW * scale;
        const h = baseH * scale;
        const radius = 90 * (1 - e) * scale;
        const rx = rotX * (1 - e);
        const ry = rotY * (1 - e);

        if (w > 1 && h > 1) {
          const clampRadius = Math.min(radius, Math.max(w / 2, 1), Math.max(h / 2, 1));
          const points = generateRoundedRectPoints(w, h, clampRadius);
          const perspectivePoints = points.map((point) => {
            const ax = (rx * Math.PI) / 180;
            const ay = (ry * Math.PI) / 180;
            const xx = point.x * Math.cos(ay);
            const yy = point.y * Math.cos(ax);
            const z = point.x * Math.sin(ay) - point.y * Math.sin(ax);
            const p = 850 / (850 + z);
            return {
              x: cx + xx * p,
              y: cy + yy * p
            };
          });

          portalCtx.save();
          portalCtx.clearRect(0, 0, portalCanvas.width, portalCanvas.height);
          portalCtx.globalAlpha = canvasOpacity;
          portalCtx.beginPath();

          const path = buildRoundedPath(perspectivePoints, true);
          portalCtx.clip(path);
          portalCtx.fillStyle = '#030303';
          portalCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);

          const media = transitionActive ? transitionVideo : (states[current].image ? portalImage : portalVideo);
          if (media && media.readyState >= 2 || media instanceof HTMLImageElement && media.complete) {
            drawCover(portalCtx, media);
          }

          if (transitionActive) {
            drawShade(portalCtx);
          }

          portalCtx.restore();
        }
      }

      function draw() {
        const now = performance.now();
        const dt = clamp(now - lastFrame || 16, 0, 40);
        lastFrame = now;

        rotX += (targetX - rotX) * Math.min(1, dt * 0.009);
        rotY += (targetY - rotY) * Math.min(1, dt * 0.009);

        portalCtx.clearRect(0, 0, portalCanvas.width, portalCanvas.height);

        if (sceneFrozen) {
          portalCtx.drawImage(sceneCanvas, 0, 0, window.innerWidth, window.innerHeight);
        }

        drawPortalMask();

        requestAnimationFrame(draw);
      }

      function cursorLoop() {
        const currentX = pointerX;
        const currentY = pointerY;
        const cursor = document.querySelector('.custom-cursor');
        const orbit = document.querySelector('.cursor-orbit');
        const dot = document.querySelector('.cursor-dot');

        const nextX = currentX + (pointerX - currentX) * 0.2;
        const nextY = currentY + (pointerY - currentY) * 0.2;

        cursor.style.transform = `translate3d(${nextX}px, ${nextY}px, 0)`;
        orbit.style.transform = `translate(-50%, -50%)`;
        dot.style.transform = `translate(-50%, -50%)`;
        requestAnimationFrame(cursorLoop);
      }

      function setCursorPosition(x, y) {
        pointerX = x;
        pointerY = y;
        const cursor = document.querySelector('.custom-cursor');
        if (!cursor.classList.contains('is-visible')) {
          cursor.classList.add('is-visible');
        }
      }

      function pointerMove(event) {
        if (window.matchMedia('(pointer: coarse)').matches) return;
        setCursorPosition(event.clientX, event.clientY);
        targetY = (event.clientX / window.innerWidth - 0.5) * 37.4;
        targetX = (event.clientY / window.innerHeight - 0.5) * -33;
      }

      function pointerLeave() {
        targetX = 0;
        targetY = 0;
        document.querySelector('.custom-cursor').classList.remove('is-visible');
      }

      function revealMask() {
        experience.classList.remove('mask-revealing');
        void experience.offsetWidth;
        experience.classList.add('mask-revealing');
        maskScale = 0;
        return animateValue((value) => {
          maskScale = value;
        }, 1050);
      }

      function revealPlanetContent() {
        experience.classList.remove('content-revealing');
        void experience.offsetWidth;
        experience.classList.add('content-revealing');
      }

      async function startExperience() {
        await mediaReady(portalVideo);
        await revealMask();
        document.body.classList.add('intro-ready');
        setTimeout(() => revealPlanetContent(), 850);
      }

      function finishPreloader() {
        if (preloaderCount.dataset.finished === 'true') return;
        preloaderCount.dataset.finished = 'true';
        preloaderValue.textContent = '100';
        preloaderCount.classList.add('is-leaving');
        floatingLogo.classList.add('is-docked');
        preloader.classList.add('is-background');
        document.body.classList.add('preload-complete');

        setTimeout(() => {
          preloaderCount.remove();
        }, 750);

        setTimeout(() => {
          floatingLogo.classList.add('is-settled');
        }, 2000);

        setTimeout(() => {
          startExperience();
        }, 1500);
      }

      function runPreloader() {
        preloaderVideo.addEventListener('loadedmetadata', () => {
          preloaderVideo.playbackRate = Math.max(0.25, preloaderVideo.duration / 3);
        });

        preloaderVideo.play().then(() => {
          const tick = () => {
            if (preloaderVideo.ended || preloaderVideo.duration === 0) {
              finishPreloader();
              return;
            }
            const pct = Math.round((preloaderVideo.currentTime / preloaderVideo.duration) * 100);
            preloaderValue.textContent = String(pct);
            if (!preloaderVideo.ended) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        }).catch(() => {
          finishPreloader();
        });

        preloaderVideo.addEventListener('ended', finishPreloader, { once: true });
      }

      async function travel() {
        if (busy || current === 'venus') return;

        busy = true;
        targetX = 0;
        targetY = 0;

        const previous = current;
        const next = current === 'mars' ? 'earth' : 'venus';

        try {
          transitionVideo.src = states[previous].portal;
          transitionVideo.load();
          experience.classList.add('is-loading');
          await mediaReady(transitionVideo, 1600);
          experience.classList.remove('is-loading');
          experience.classList.remove('content-revealing', 'mask-revealing');
          experience.classList.add('is-transitioning');

          transitionVideo.currentTime = 0;
          transitionVideo.playbackRate = 1.3;
          transitionActive = true;
          canvasOpacity = 1;
          await transitionVideo.play();
          await animateValue((value) => {
            expansion = value;
          }, 1100);

          await new Promise((resolve) => {
            transitionVideo.addEventListener('ended', resolve, { once: true });
          });

          sceneFrozen = true;
          sceneCtx.clearRect(0, 0, sceneCanvas.width, sceneCanvas.height);
          sceneCtx.setTransform(1, 0, 0, 1, 0, 0);
          drawCover(sceneCtx, transitionVideo);
          sceneCtx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);

          current = next;
          experience.classList.add('is-committing');
          render();
          await nextFrame();
          await nextFrame();

          transitionActive = false;
          expansion = 0;
          maskScale = 0;
          canvasOpacity = 1;
          experience.classList.remove('is-transitioning', 'is-committing');

          await revealMask();
          setTimeout(() => revealPlanetContent(), 100);
          await new Promise((resolve) => setTimeout(resolve, 450));
          transitionVideo.removeAttribute('src');
          transitionVideo.load();
        } catch (error) {
          transitionActive = false;
          expansion = 0;
          maskScale = 1;
          canvasOpacity = 1;
          experience.classList.remove('is-transitioning', 'is-committing');
        } finally {
          busy = false;
        }
      }

      function setupCursor() {
        const cursor = document.querySelector('.custom-cursor');
        const portalEl = document.getElementById('portal');

        portalEl.addEventListener('pointerenter', () => cursor.classList.add('is-enter'));
        portalEl.addEventListener('pointerleave', () => cursor.classList.remove('is-enter'));
        document.addEventListener('pointermove', pointerMove);
        document.addEventListener('pointerleave', pointerLeave);
      }

      function setupEvents() {
        portal.addEventListener('click', travel);
        window.addEventListener('resize', resizeCanvas);
        menuButton?.addEventListener('click', () => {
          // Kept deliberately lightweight so the interaction remains simple to understand.
        });
      }

      function init() {
        resizeCanvas();
        render();
        setupCursor();
        setupEvents();
        requestAnimationFrame(draw);
        requestAnimationFrame(cursorLoop);
        runPreloader();
      }

      init();
    </script>
  </body>
</html>
